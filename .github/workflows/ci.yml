name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            failed=0
            while IFS= read -r file; do
              if git cat-file -e "$base_sha:$file" 2>/dev/null && \
                ! git show "$base_sha:$file" | pnpm exec prettier --check --stdin-filepath "$file" >/dev/null 2>&1; then
                echo "Legacy formatting debt (not worsened): $file"
                continue
              fi
              pnpm exec prettier --check "$file" || failed=1
            done < <(git diff --diff-filter=ACMR --name-only "$base_sha"...HEAD -- \
              '*.css' '*.json' '*.md' '*.mjs' '*.ts' '*.tsx' '*.yml' '*.yaml')
            exit "$failed"
          else
            pnpm format:check
          fi

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
